<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>畢業啦～ 🎓 高中畢業學分自我檢核 App</title>
  <meta name="description" content="專為高中學生設計的手機端畢業學分自我檢核與學習預警 App。極速、活潑可愛、資料 100% 本地保存！">
  <!-- Google Fonts: Zen Maru Gothic & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- html2canvas & jsPDF for PNG/PDF Export -->
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <link rel="stylesheet" href="style.css?v=12.0">
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand">
        <span class="brand-icon">🎓</span>
        <div class="brand-text">
          <h1 class="app-title">畢業啦～</h1>
          <span class="app-subtitle">高中學分檢核 & 畢業預警</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="exportPngBtn" class="cute-pill-btn btn-png" title="下載 PNG 圖片">🖼️ 下載圖片</button>
        <button id="exportPdfBtn" class="cute-pill-btn btn-pdf" title="下載 PDF 文件">📄 下載 PDF</button>
        <button id="themeToggleBtn" class="icon-btn" title="切換主題" aria-label="切換主題">🌙</button>
      </div>
    </header>

    <!-- Student Status Bar (年級跟班別在同一列) -->
    <section class="student-status-bar">
      <div class="status-single-row">
        <div class="status-col">
          <span class="status-icon">🎒</span>
          <span class="status-label-text">年級：</span>
          <select id="currentGradeSelect" class="grade-select">
            <option value="1">高一</option>
            <option value="2" selected>高二</option>
            <option value="3">高三</option>
          </select>
        </div>
        
        <div class="status-col">
          <span class="status-icon">🏫</span>
          <span class="status-label-text">班別：</span>
          <select id="trackSelect" class="track-select">
            <!-- Dynamic JS Population based on Grade -->
          </select>
        </div>
      </div>
    </section>

    <!-- Fixed Real-Time Credit Dashboard (Sticky) -->
    <section class="sticky-dashboard">
      <div class="dashboard-main-ring">
        <div class="ring-content">
          <div class="ring-number" id="totalEarnedVal">0</div>
          <div class="ring-label">/ 150 總學分</div>
        </div>
        <div class="badge-status" id="dashShortageBadge">還差 150 學分</div>
      </div>

      <!-- 3 Key Credit Category Bars (108 課綱最新標準) -->
      <div class="category-bars-grid">
        <!-- 1. Compulsory (部定及校訂必修 Target 102) -->
        <div class="cat-card required-card">
          <div class="cat-header">
            <span class="cat-dot"></span>
            <span class="cat-title">部定及校訂必修</span>
            <span class="cat-count"><strong id="reqEarnedVal">0</strong> / 102</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill required-fill" id="reqProgressFill" style="width: 0%;"></div>
          </div>
        </div>

        <!-- 2. Elective (選修學分 Target 40) -->
        <div class="cat-card elective-card">
          <div class="cat-header">
            <span class="cat-dot"></span>
            <span class="cat-title">選修學分</span>
            <span class="cat-count"><strong id="elecEarnedVal">0</strong> / 40</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill elective-fill" id="elecProgressFill" style="width: 0%;"></div>
          </div>
        </div>

        <!-- 3. Other (其他必選修) -->
        <div class="cat-card other-card">
          <div class="cat-header">
            <span class="cat-dot"></span>
            <span class="cat-title">其他必選修</span>
            <span class="cat-count"><strong id="otherEarnedVal">0</strong> 學分</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill other-fill" id="otherProgressFill" style="width: 0%;"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Graduation Warning & Analysis Card -->
    <section class="warning-section">
      <div class="warning-card" id="warningCard">
        <div class="warning-badge-row">
          <span class="warning-pill" id="warningLevelPill">🟢 畢業安全</span>
          <span class="warning-calc-text" id="warningCalcSummary">推估最高可得: -- 學分</span>
        </div>
        <div class="warning-message" id="warningMessage">
          讀取學分狀態中...
        </div>
        <div class="warning-details" id="warningDetails"></div>
      </div>
    </section>

    <!-- Main Content Area: Subject List for Selected Semester -->
    <main class="main-content">
      <div class="semester-header-bar">
        <div class="sem-title-box">
          <h2 class="current-sem-title" id="currentSemTitle">高一上 學期科目</h2>
          <span class="current-sem-stats" id="currentSemStats">已取得 0 / 0 學分</span>
        </div>
      </div>

      <!-- Subject Items Grid/List -->
      <div class="subject-list" id="subjectListContainer">
        <!-- Dynamic JS Insertion -->
      </div>
    </main>

    <!-- Notebook Index Divider Tabs (Fixed Bottom 筆記本側邊/下方索引切換卡片) -->
    <div class="notebook-tabs-sticky-wrapper">
      <div class="notebook-index-tabs" id="semesterNav">
        <button class="notebook-tab tab-1 active" data-sem="1">
          <span class="tab-label">高一上</span>
          <span class="tab-badge" id="semBadge1">0</span>
        </button>
        <button class="notebook-tab tab-2" data-sem="2">
          <span class="tab-label">高一下</span>
          <span class="tab-badge" id="semBadge2">0</span>
        </button>
        <button class="notebook-tab tab-3" data-sem="3">
          <span class="tab-label">高二上</span>
          <span class="tab-badge" id="semBadge3">0</span>
        </button>
        <button class="notebook-tab tab-4" data-sem="4">
          <span class="tab-label">高二下</span>
          <span class="tab-badge" id="semBadge4">0</span>
        </button>
        <button class="notebook-tab tab-5" data-sem="5">
          <span class="tab-label">高三上</span>
          <span class="tab-badge" id="semBadge5">0</span>
        </button>
        <button class="notebook-tab tab-6" data-sem="6">
          <span class="tab-label">高三下</span>
          <span class="tab-badge" id="semBadge6">0</span>
        </button>
      </div>
    </div>

    <!-- Footer Information -->
    <footer class="app-footer">
      <p class="footer-quote">✨ 每一分努力，都是邁向畢業的腳步！ ✨</p>
      <div class="footer-links">
        <button id="resetDataBtn" class="reset-prominent-btn">🔄 重置</button>
      </div>
    </footer>
  </div>

  <script src="app.js?v=12.0"></script>
</body>
</html>
